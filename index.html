<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Bel CCA</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  text-align: center;
  padding: 20px;
}

button {
  font-size: 20px;
  padding: 15px;
  margin: 8px;
  width: 200px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}

.tim-btn { background: #22c55e; color: black; }
#tombol {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  justify-items: center;
  margin-top: 20px;
}
</style>
</head>

<body>

<h1>🔔 BEL CCA</h1>

<label>Jumlah Tim:</label>
<select id="jumlah">
  <option value="2">2 Tim</option>
  <option value="3">3 Tim</option>
  <option value="4">4 Tim</option>
</select>

<br><br>

<input id="t1" placeholder="Tim A">
<input id="t2" placeholder="Tim B">
<input id="t3" placeholder="Tim C">
<input id="t4" placeholder="Tim D">

<br><br>

<button onclick="mulai()">MULAI</button>
<button onclick="fullscreen()">FULLSCREEN</button>

<hr>

<h2 id="status">SIAP</h2>
<div id="tombol"></div>

<br>
<button onclick="resetBel()">RESET</button>

<audio id="sound">
  <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>

<!-- 🔥 SCRIPT FIREBASE + LOGIC (SATU SCRIPT SAJA) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "ISI_PUNYAMU",
  authDomain: "ISI_PUNYAMU",
  databaseURL: "https://bel1-a22de-default-rtdb.firebaseio.com",
  projectId: "ISI_PUNYAMU",
  storageBucket: "ISI_PUNYAMU",
  messagingSenderId: "ISI_PUNYAMU",
  appId: "ISI_PUNYAMU"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const belRef = ref(db, "bel");

// ambil element SEKALI
const jumlah = document.getElementById("jumlah");
const t1 = document.getElementById("t1");
const t2 = document.getElementById("t2");
const t3 = document.getElementById("t3");
const t4 = document.getElementById("t4");
const tombol = document.getElementById("tombol");
const status = document.getElementById("status");
const sound = document.getElementById("sound");

// ===== MULAI =====
window.mulai = function () {
  const jml = Number(jumlah.value);
  const nama = [
    t1.value || "Tim A",
    t2.value || "Tim B",
    t3.value || "Tim C",
    t4.value || "Tim D"
  ];

  tombol.innerHTML = "";
  status.innerText = "SIAP";

  for (let i = 0; i < jml; i++) {
    const b = document.createElement("button");
    b.className = "tim-btn";
    b.innerText = nama[i];
    b.onclick = () => tekan(nama[i]);
    tombol.appendChild(b);
  }

  set(belRef, { status: "siap" });
};

// ===== TEKAN BEL =====
window.tekan = function (nama) {
  set(belRef, {
    status: "terkunci",
    pemenang: nama,
    waktu: Date.now()
  });
};

// ===== REALTIME =====
onValue(belRef, snap => {
  if (!snap.exists()) return;
  const d = snap.val();

  if (d.status === "terkunci") {
    status.innerText = d.pemenang + " MENEKAN BEL";
    sound.play();
  }

  if (d.status === "siap") {
    status.innerText = "SIAP";
  }
});

// ===== RESET =====
window.resetBel = function () {
  set(belRef, { status: "siap" });
};

// ===== FULLSCREEN =====
window.fullscreen = function () {
  document.documentElement.requestFullscreen();
};
</script>


</body>
</html>
